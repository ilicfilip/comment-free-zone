name: Playground Comment on Merge

on:
  pull_request:
    types:
      - closed

jobs:
  comment:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write

    steps:
      - name: Post Playground comment
        uses: actions/github-script@v7
        with:
          script: |
            const repo = context.repo.owner + '/' + context.repo.repo;
            const playgroundUrl = `https://playground.wordpress.net/#{"networking":true,"login":true,"plugins":["https://github-proxy.com/proxy/?repo=${repo}&branch=develop"]}`;
            const zipUrl = `https://github.com/${repo}/archive/refs/heads/develop.zip`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '## Test the merged changes',
                '',
                `[Test on WordPress Playground](${playgroundUrl})`,
                '',
                `[Download develop branch as zip](${zipUrl})`,
              ].join('\n'),
            });
