name: Plugin Check

on:
  pull_request:

jobs:
  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: wp-cli

      - name: Build plugin archive
        run: |
          wp package install wp-cli/dist-archive-command
          wp dist-archive . ./comment-free-zone.zip

      - name: Run plugin check
        uses: wordpress/plugin-check-action@v1.0.6
        with:
          build-dir: ./comment-free-zone.zip
